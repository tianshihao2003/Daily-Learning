# 目标：把课程给的前端工程跑起来，让页面上的请求经 nginx 反向代理打到后端。
#
# 【前端工程】课程资料 03. 前端环境/nginx-1.22.0-web.zip（解压后目录）：
#   nginx.exe              绿色版 nginx（双击或命令行 .\nginx.exe 启动）
#   conf/nginx.conf        它的配置（下面要补的就是这个文件里的 server 块）
#   html/                  前端页面存放处（index.html + assets/ 里的 js、css）
#   logs/                  日志目录
#   注意：压缩包要拷到一个「没有中文、不带空格」的目录下再解压。
#
# 【前端页面】跑在 90 端口，页面地址 http://localhost:90
#   前端代码里的请求统一带 /api 前缀（axios 的 baseURL 是 "/api"），
#   所以页面上的按钮真正发出的请求是：
#     GET    http://localhost:90/api/depts          查询全部部门
#     POST   http://localhost:90/api/depts          新增部门（请求体 JSON）
#     GET    http://localhost:90/api/depts/1        根据 ID 查询（修改前回显）
#     PUT    http://localhost:90/api/depts          修改部门（请求体 JSON）
#     DELETE http://localhost:90/api/depts?id=1     删除部门
#
# 【后端应用】SpringBoot 工程跑在 8080 端口，接口路径不带 /api：
#     GET /depts、POST /depts、GET /depts/{id}、PUT /depts、DELETE /depts?id=1
#   连的是本机 MySQL 的 tlias 库（主机 localhost、端口 3306）
#   用户名/密码用你自己 MySQL 的（课程示例是 root / 1234，
#   动手时把 password 换成你自己 MySQL 的密码）
#
# 【要补的配置写在哪儿】
#   下面这个 server 块对应 nginx.conf 里 http { server { ... } } 里层的部分，
#   只需在 server 块内部补内容。
# ==========================================================================


