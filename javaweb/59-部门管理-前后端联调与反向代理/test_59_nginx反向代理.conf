# ==========================================================================
# 题目2-6：补全 /api 反向代理的配置
# ==========================================================================
# 需求：
#   在下面 server 块里补出"把 /api 开头的请求转发给后端"的配置，并给每行写注释：
#   - 前端页面跑在 90 端口，前端发出的请求形如 GET http://localhost:90/api/depts；
#   - 后端 SpringBoot 应用跑在 http://localhost:8080，接口路径不带 /api（如 /depts）；
#   - 90 端口上其它请求（/、/assets/xxx.js）仍然由 nginx 自己返回静态资源。
#
# 完成以下操作：
# 1. 写出匹配 /api/ 开头请求的那段 location（含去掉前缀、转发两步）
# 2. 给每一条指令写一行中文注释
# ==========================================================================

# 在下面写你的代码：

server {
    listen       90;
    server_name  localhost;

    # 静态页面（前端工程）直接由 nginx 返回，这段已经给好
    location / {
        root   html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 在这里补全 /api 反向代理的配置：

}


