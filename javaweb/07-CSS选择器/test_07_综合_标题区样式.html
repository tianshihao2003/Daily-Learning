<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<title>标题区样式</title>
		<!-- ============================================ -->
		<!-- 综合题3-1：用选择器把新闻页面的样式管起来 -->
		<!-- ============================================ -->
		<!-- 步骤： -->
		<!-- 1. 让页面上所有跳转文字都去掉下划线（一条规则） -->
		<!-- 2. 把两处日期文字都调成浅灰 #b2b2b2：只写一条规则、名字可复用（两处分别在上方标题区和页脚） -->
		<!-- 3. 只让"正文区"里的段落行高 2 倍、首行缩进 2 个字符；"侧边栏"里的段落不受影响 -->
		<!-- 4. 想一想并动手验证：第 2 步的规则和第 1 步的规则撞到同一个元素时谁生效？把两条规则的顺序换一换，效果变不变？ -->
		<!-- 提示（只给要求不含答案）：要选"某个区域里面的元素"时，需要先给那个区域起个名字 -->
		<!-- ============================================ -->

		<!-- 在下面写你的代码： -->

	</head>
	<body>
		<h1>【新思想引领新征程】推进长江十年禁渔 谱写长江大保护新篇章</h1>
		<a href="https://www.cctv.com" target="_blank">央视网</a>

		<!-- 日期一：新闻发布时间 -->
		<span>2024年05月15日 20:07</span>

		<!-- 正文区 -->
		<div>
			<p>央视网消息（新闻联播）：作为共抓长江大保护的标志性工程，长江十年禁渔今年进入第四年。</p>
			<img src="img/1.gif" width="80%">
			<p>行走在长江沿线，科研人员发现很多可喜现象。</p>
		</div>

		<!-- 侧边栏 -->
		<div>
			<p>侧边栏：相关阅读推荐。</p>
		</div>

		<!-- 日期二：页脚更新时间 -->
		<footer>
			<span>2026年09月29日 更新</span>
		</footer>
	</body>
</html>
