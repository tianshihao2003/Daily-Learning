<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<title>隔行换色</title>
		<style>
			table {
				width: 100%;
				border-collapse: collapse;
			}
			th, td {
				border: 1px solid #ddd;
				padding: 8px;
				text-align: center;
			}
			th {
				background-color: #f2f2f2;
				font-weight: bold;
			}

	</head>
	<body>
		<!-- ============================================ -->
		<!-- 题目2-4：实现表格隔行换色 -->
		<!-- ============================================ -->
		<!-- 要求： -->
		<!-- 1. 表格数据行共 5 行：奇数行背景色 #f2e2e2、偶数行背景色 #e6f7ff -->
		<!-- 2. 表头不能被染色 -->

		<!-- ============================================ -->

		<table>
			<thead>
				<tr>
					<th>学号</th>

				</tr>
			</thead>

				<tr>

				</tr>

				</tr>
				<tr>
					<td>004</td>

				</tr>
				<tr>
					<td>005</td>
					<td>孙七</td>
					<td>96</td>
				</tr>
			</tbody>
		</table>

	</body>
</html>
