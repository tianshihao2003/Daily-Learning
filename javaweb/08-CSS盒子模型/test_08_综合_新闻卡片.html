<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<title>综合题：给新闻页面做一块卡片</title>

		<!-- ============================================ -->
		<!-- 综合题：给新闻页面做一块"卡片" -->
		<!-- ============================================ -->
		<!-- 页面骨架已备好：内容容器（id 是 content-container）里有标题、正文， -->
		<!-- 正文后面是一张"延伸阅读卡片"（class 是 card）。要求： -->
		<!-- 1. 内容容器占版面 70%，上下不留间距、左右居中 -->
		<!-- 2. 卡片四边的内边距都是 20px -->
		<!-- 3. 卡片加 2px 实线边框，颜色 #05a5d2 -->
		<!-- 4. 卡片跟上面正文隔开：上外边距 30px、左右 0、下外边距 30px（写一条简写） -->
		<!-- 5. 卡片宽度写成 600px，并让它实际占的宽度就是 600px（内边距和边框不再往里加） -->
		<!-- 6. 做完打开浏览器 F12 检查两件事： -->
		<!--    ① 内容容器左右两侧的留白是否相等 -->
		<!--    ② 第 5 步之前卡片总宽 644px、之后总宽 600px -->
		<!-- ============================================ -->

		<!-- 在下面写你的代码： -->

	</head>
	<body>
		<div id="content-container">
			<h1>【新思想引领新征程】推进长江十年禁渔 谱写长江大保护新篇章</h1>
			<p>央视网消息（新闻联播）：作为共抓长江大保护的标志性工程，长江十年禁渔今年进入第四年。</p>

			<div class="card">
				<p>延伸阅读：长江十年禁渔实施以来，沿江省市合力攻坚、久久为功。</p>
			</div>
		</div>
	</body>
</html>
