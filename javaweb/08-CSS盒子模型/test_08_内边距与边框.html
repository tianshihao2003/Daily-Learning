<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<title>算一算盒子实际占多宽</title>

		<!-- ============================================ -->
		<!-- 题目2-2：算一算：加完内边距和边框，盒子总宽变成多少 -->
		<!-- ============================================ -->
		<!-- 下面已经给出了这个盒子（class 是 box）的样式： -->
		<!--   width: 200px;  height: 100px; -->
		<!--   padding: 20px;  border: 2px solid #05a5d2; -->
		<!-- 要求： -->
		<!-- 1. 先算出这个盒子在页面上实际占多宽、多高（宽高各是多少像素），把答案写成一行注释 -->
		<!-- 2. 打开浏览器按 F12，选中这个盒子，在"盒模型"面板里核对你的答案 -->
		<!-- 3. 再补一条属性，让盒子的总宽就是 200px、不会被内边距和边框撑大 -->
		<!-- 4. 再刷新核对一次：总宽变成多少？内容区还剩多少？ -->
		<!-- ============================================ -->

		<style>
			.box {
				width: 200px;
				height: 100px;
				background-color: #eaf7fa;
				padding: 20px;
				border: 2px solid #05a5d2;
			}
		</style>

		<!-- 在下面写你的代码： -->

	</head>
	<body>
		<div class="box">我是一个盒子</div>
	</body>
</html>
