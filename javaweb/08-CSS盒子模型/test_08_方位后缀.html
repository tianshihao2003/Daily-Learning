<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<title>只给左侧留出缩进</title>

		<!-- ============================================ -->
		<!-- 题目2-4：只给左侧留出缩进 -->
		<!-- ============================================ -->
		<!-- 要求（那段引用文字的 class 是 quote）： -->
		<!-- 1. 只在它的左边留 40px 的空白（把文字往右推），右边和上下都不动 -->
		<!-- 2. 再只给它加一条下边框：1px、实线、颜色 #b2b2b2 -->
		<!-- 3. 样式写在本文件 head 里（下面的写作区） -->
		<!-- 4. 做完打开浏览器：文字左边应该有一段空白，下方有一条浅灰细线 -->
		<!-- ============================================ -->

		<!-- 在下面写你的代码： -->

	</head>
	<body>
		<p>下面这段是引用别人的话：</p>
		<p class="quote">长江十年禁渔是为全局计、为子孙谋的重要决策。</p>
		<p>上面这段引用下方有一条线，左边还留了一段空白。</p>
	</body>
</html>
