<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<title>用最少的代码给盒子四边留出不同间距</title>

		<!-- ============================================ -->
		<!-- 题目2-3：用最少的代码给盒子四边留出不同间距 -->
		<!-- ============================================ -->
		<!-- 要求（盒子 class 是 box，它的边框和背景色已经给好）： -->
		<!-- 1. 盒子外面：上面留 10px、左右留 20px、下面留 30px -->
		<!-- 2. 盒子里面：四边的内边距都是 15px -->
		<!-- 3. 每个属性各写一条声明，不许拆成四行（不许用左边、右边那种单项写法） -->
		<!-- 4. 样式写在本文件 head 里（下面的写作区） -->
		<!-- 5. 做完打开浏览器：盒子上下的空白应该不一样高，内边距四边一样宽 -->
		<!-- ============================================ -->

		<style>
			body {
				border: 1px dashed #b2b2b2;
			}
			.box {
				width: 200px;
				background-color: #eaf7fa;
				border: 1px solid #b2b2b2;
			}
		</style>

		<!-- 在下面写你的代码： -->

	</head>
	<body>
		<p>我是盒子上面的内容</p>
		<div class="box">我是一个盒子</div>
		<p>我是盒子下面的内容</p>
	</body>
</html>
