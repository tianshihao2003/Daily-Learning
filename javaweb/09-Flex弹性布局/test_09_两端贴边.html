<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<title>三个方块横向排开，两端贴边、中间均分</title>

		<!-- ============================================ -->
		<!-- 题目2-1：三个方块横向排开，两端贴边、中间均分 -->
		<!-- ============================================ -->
		<!-- 容器（id 是 container）里已经放了三个方块（class 是 item）。要求： -->
		<!-- 1. 三个方块横着排成一行（现在就堆成三行了） -->
		<!-- 2. 第一个贴着容器左边、第三个贴着容器右边 -->
		<!-- 3. 剩下的空间在它们之间的空隙里平分（不要给方块写外边距） -->
		<!-- 4. 样式写在本文件 head 里（下面的写作区） -->
		<!-- ============================================ -->

		<style>
			#container {
				width: 500px;
				height: 200px;
				background-color: #f1eeee;
			}
			.item {
				width: 80px;
				height: 50px;
				background-color: rgb(184, 246, 184);
				border: 1px solid rgb(141, 138, 138);
			}
		</style>

		<!-- 在下面写你的代码： -->

	</head>
	<body>
		<div id="container">
			<div class="item">1</div>
			<div class="item">2</div>
			<div class="item">3</div>
		</div>
	</body>
</html>
