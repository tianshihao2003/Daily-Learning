<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<title>竖着排并整体上下居中</title>

		<!-- ============================================ -->
		<!-- 题目2-3：让三个方块竖着排，并且整体上下居中 -->
		<!-- ============================================ -->
		<!-- 容器（id 是 container）高 300px，里面三个方块现在是横着排的。要求： -->
		<!-- 1. 让它们改成从上往下竖着排 -->
		<!-- 2. 这一列在容器里上下居中（上方和下方的留白一样高） -->
		<!-- 3. 样式写在本文件 head 里（下面的写作区） -->
		<!-- 4. 做完再试着把主轴换回水平方向：那个"居中"会变成哪种居中？想一想为什么 -->
		<!-- ============================================ -->

		<style>
			#container {
				width: 500px;
				height: 300px;
				background-color: #f1eeee;
			}
			.item {
				width: 80px;
				height: 50px;
				background-color: rgb(184, 246, 184);
				border: 1px solid rgb(141, 138, 138);
			}
		</style>

		<!-- 在下面写你的代码： -->

	</head>
	<body>
		<div id="container">
			<div class="item">1</div>
			<div class="item">2</div>
			<div class="item">3</div>
		</div>
	</body>
</html>
