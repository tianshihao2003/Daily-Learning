<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<title>删除行</title>
		<style>
			table {
				width: 100%;
				border-collapse: collapse;
			}
			th, td {
				border: 1px solid #ddd;
				padding: 8px;
				text-align: center;
			}
			th {
				background-color: #f2f2f2;
				font-weight: bold;
			}
		</style>
	</head>
	<body>
		<!-- ============================================ -->
		<!-- 题目2-2：给删除按钮接上事件 -->
		<!-- ============================================ -->
		<!-- 要求： -->
		<!-- 1. 表格每行最后一列都有一个“删除”按钮（class 为 del） -->
		<!-- 2. 给每个删除按钮绑定点击事件：点击后这一整行从表格里消失，其他行不受影响 -->
		<!-- 检查点：点哪一行的按钮，只有那一行消失；表头和其他行都还在 -->
		<!-- ============================================ -->

		<table>
			<thead>
				<tr>
					<th>姓名</th>
					<th>性别</th>
					<th>职位</th>
					<th>操作</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td>令狐冲</td>
					<td>男</td>
					<td>讲师</td>
					<td><button type="button" class="del">删除</button></td>
				</tr>
				<tr>
					<td>任盈盈</td>
					<td>女</td>
					<td>咨询师</td>
					<td><button type="button" class="del">删除</button></td>
				</tr>
				<tr>
					<td>向问天</td>
					<td>男</td>
					<td>班主任</td>
					<td><button type="button" class="del">删除</button></td>
				</tr>
				<tr>
					<td>任我行</td>
					<td>男</td>
					<td>教研主管</td>
					<td><button type="button" class="del">删除</button></td>
				</tr>
			</tbody>
		</table>

		</script>
	</body>
</html>
