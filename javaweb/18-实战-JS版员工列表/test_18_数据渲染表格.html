<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<title>数据渲染表格</title>
		<style>
			table {
				width: 100%;
				border-collapse: collapse;
			}
			th, td {
				border: 1px solid #ddd;
				padding: 8px;
				text-align: center;
			}
			th {
				background-color: #f2f2f2;
				font-weight: bold;
			}
		</style>
	</head>
	<body>
		<!-- ============================================ -->
		<!-- 题目2-1：用数据渲染表格 -->
		<!-- ============================================ -->
		<!-- 要求： -->
		<!-- 1. 定义一个数组，里面放 3 个员工对象（字段：name/姓名、gender/性别、position/职位，数据自己编） -->
		<!-- 2. 用循环把每一条数据拼成一行 HTML（一行一个 tr），最后拼成一个整字符串 -->
		<!-- 3. 一次性渲染进表格的 tbody（表格现在只有表头，一行数据都没有） -->
		<!-- 检查点：页面出现 3 行数据、顺序和数组一致；往数组里加一条刷新页面，页面自动多一行 -->
		<!-- ============================================ -->

		<table>
			<thead>
				<tr>
					<th>姓名</th>
					<th>性别</th>
					<th>职位</th>
				</tr>
			</thead>
			<tbody>

			</tbody>
		</table>

	</body>
</html>
