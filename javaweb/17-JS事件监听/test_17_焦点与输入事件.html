	<body>
		<!-- ============================================ -->
		<!-- 题目2-4：让输入框“有反应” -->

		<!-- 要求： -->
		<!-- 1. 输入框（#username）获得焦点时，把 #tip 的文字改成：正在输入姓名… -->
		<!-- 2. 输入框失去焦点时，把 #tip 的文字改成：输入完成：（后面接上输入框里的内容） -->
		<!-- 3. 输入框里每敲一个字，就把当前输入的内容实时显示在 #tip 里 -->
		<!-- 检查点：点进输入框提示变成“正在输入姓名…”；敲字时 #tip 跟着变；点到别处变成“输入完成：xxx” -->
		<!-- ============================================ -->

		<label for="username">姓名：</label>
		<input type="text" id="username" placeholder="请输入姓名">
		<p id="tip">（这里显示提示）</p>
