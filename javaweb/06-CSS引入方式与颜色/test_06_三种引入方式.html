<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<title>三种引入方式</title>
		<!-- ============================================ -->
		<!-- 题目2-1：用三种方式分别给三段文字设颜色 -->
		<!-- ============================================ -->
		<!-- 要求：body 里已经有三行文字，让它们分别显示成三种颜色 -->
		<!-- 1. 第一行：用行内的方式设成红色（样式直接加在 body 里那一行标签上） -->
		<!-- 2. 第二行：用内部的方式设成绿色（样式写在本文件 head 里，也就是下面的写作区） -->
		<!-- 3. 第三行：用外部的方式设成蓝色——规则写在同目录的 test_06_外部样式.css 里，并在本文件里把这个样式文件引入进来 -->
		<!-- 检查点：双击打开后三行文字颜色都生效，且三个颜色来自三个不同的地方 -->
		<!-- ============================================ -->

		<!-- 在下面写你的代码： -->

	</head>
	<body>
		<!-- 第一行文字：在它的标签上加行内样式（红色） -->
		<h1>行内样式的文字</h1>

		<!-- 第二行文字：由本文件里的内部样式选中（绿色） -->
		<p>内部样式的文字</p>

		<!-- 第三行文字：由外部样式文件选中（蓝色） -->
		<span>外部样式的文字</span>
	</body>
</html>
